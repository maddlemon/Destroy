plugins {
    id "eclipse"
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.74'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = true

    accessTransformers {
        from('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // Also used as a data check: loads every datapack like a dedicated server (no EULA step), logs parse errors
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.debug.export', 'true'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main { 
    resources {
        srcDir 'src/generated/resources'
        exclude '.cache/'
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel, Create
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {

    // Library
    implementation "maven.modrinth:petrolpark:${petrolpark_library_version}"

    // Registrate (bundled with Petrolpark's Library)
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create & Ponder
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // OPTIONAL

    // pquality
    implementation("maven.modrinth:pquality:${pquality_version}")
    // JEI
    implementation("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Curios: only exercised at runtime (DestroyCurios goes through the library's PetrolparkCurios)
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    // Compile-only compat target (compat.farmersdelight mixins are skipped by DestroyMixinPlugin when the mod is absent).
    // The Sodium/Embeddium mixins target classes by name, so those mods aren't needed to compile.
    compileOnly("maven.modrinth:farmers-delight:${farmers_delight_version}")

}

jar {
    manifest.attributes([
        "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '10000' // show the full error list during the port
}

tasks.withType(Copy) {
    duplicatesStrategy = 'inherit'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
// idea {
//     module {
//         downloadSources = true
//         downloadJavadoc = true
//     }
// }

// Javadoc has many stale {@link}s from the port; don't let them fail `build` (the jar itself is unaffected)
tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Dev-only scripted test client (src/autotest), never part of the jar. Run with
// ./gradlew runAutotestClient -Pautotest -PautotestScript=<absolute path to script>
if (project.hasProperty('autotest')) {
    sourceSets.create('autotest')
    configurations {
        autotestCompileClasspath.extendsFrom compileClasspath
        autotestRuntimeClasspath.extendsFrom runtimeClasspath
    }
    dependencies { autotestImplementation sourceSets.main.output }
    neoForge {
        mods { destroytest { sourceSet(sourceSets.autotest) } }
        runs {
            autotestClient {
                client()
                sourceSet = sourceSets.autotest
                gameDirectory = file('run-autotest')
                systemProperty 'destroytest.script', project.findProperty('autotestScript') ?: ''
                programArguments.addAll('--width', '1280', '--height', '720')
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }
}
